steps:
  # Install dependencies
  - name: 'node'
    entrypoint: 'npm'
    args:
      - 'ci'

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/graffiticode/l0166:$COMMIT_SHA'
      - '.'

  # Push image to Container Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'gcr.io/graffiticode/l0166:$COMMIT_SHA'
    id: Push

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - run
      - deploy
      - l0166
      - '--platform=managed'
      - '--image=gcr.io/graffiticode/l0166:$COMMIT_SHA'
      - >-
        --labels=commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - '--region=$_DEPLOY_REGION'
      - '--quiet'
      # ISOLATE-01: this compiler reaches the outside only through the egress proxy
      # (graffiticode/graffiticode deploy/egress-proxy; checked by scripts/legacy-network-check.js).
      # --update-env-vars, not --set-env-vars: the proxy variables must survive every deploy.
      - '--network=compilers'
      - '--subnet=compilers-default'
      - '--network-tags=compiler'
      - '--vpc-egress=all-traffic'
      - '--update-secrets=/etc/egress-ca/ca.pem=egress-proxy-ca-bundle:1'
      - '--update-env-vars=^@^AUTH_URL=$_AUTH_URL@HTTPS_PROXY=http://10.8.0.2:3128@HTTP_PROXY=http://10.8.0.2:3128@NO_PROXY=169.254.169.254,metadata.google.internal@NODE_EXTRA_CA_CERTS=/etc/egress-ca/ca.pem@NODE_USE_ENV_PROXY=1'
      - '--allow-unauthenticated'
    id: Deploy
    entrypoint: gcloud

images:
  - 'gcr.io/graffiticode/l0166:$COMMIT_SHA'

options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _DEPLOY_REGION: us-central1
  _AUTH_URL: https://auth.graffiticode.org

tags:
  - l0166
